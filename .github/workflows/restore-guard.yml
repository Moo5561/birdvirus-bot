name: restore guard

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main

permissions:
  contents: write

jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - name: checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: check whether the guest453 guard is present and correct
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          GUARD=.github/workflows/undo-guest453.yml
          MISSING=0
          if [ ! -f "$GUARD" ]; then
            echo "guard file is missing"
            MISSING=1
          elif ! grep -q "^name: undo guest453" "$GUARD"; then
            echo "guard file was tampered with"
            MISSING=1
          fi

          if [ "$MISSING" = "1" ]; then
            cat > "$GUARD" <<'GUARD_EOF'
name: undo guest453

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  close-guest-pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'Guest453'
    runs-on: ubuntu-latest
    steps:
      - name: close guest pr
        env:
          PR_NUM: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr close "$PR_NUM" --comment "🚫 rejected automatically: PRs from guest453 are auto-closed." || exit 0

  revert-guest-commits:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: checkout with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: revert push if it contains guest authored commits
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -e
          echo "scanning commits $BEFORE..$AFTER"
          shopt -s nocasematch
          authors="Guest453|victorromeojaime981|202215077"
          if git log --format="%an %ae" "$BEFORE..$AFTER" | grep -qiE "guest453|victorromeojaime981|202215077"; then
            echo "guest-authored commits found; reverting"
            git reset --hard "$BEFORE"
            git push --force origin "HEAD:refs/heads/main"
          else
            echo "no guest-authored commits; nothing to do"
          fi
GUARD_EOF

            chmod 0644 "$GUARD"
            git add "$GUARD"
            git -c user.name="guard-restorer" -c user.email="guard-restorer@users.noreply.github.com" \
              commit -m "restore auto-denier guard (healed by watchdog)"
            git push origin "HEAD:refs/heads/main"
            echo "guard restored"
          else
            echo "guard is intact"
          fi