# Deploys the public site (site/ plus the birdvirus-cloud front-end) to GitHub Pages.
#
# This deliberately does NOT upload the whole repository. Doing that published the
# bot source, .env.example, bot/banned_users.txt and the tracked sqlite database to
# a public URL. Only the files staged into _site/ below are ever served.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage site
        run: |
          mkdir -p _site/birdvirus-cloud
          # site/ becomes the root, so /index.html, /privacy.html, /terms.html stay put
          cp site/index.html site/privacy.html site/terms.html site/pepsi.svg _site/
          # the cloud front-end keeps its /birdvirus-cloud/ path. server.js is not
          # copied: Pages is static only, so the /api/chat backend cannot run here.
          cp birdvirus-cloud/index.html birdvirus-cloud/app.js birdvirus-cloud/styles.css _site/birdvirus-cloud/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
