name: undo guest453

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  close-guest-pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'Guest453'
    runs-on: ubuntu-latest
    steps:
      - name: close guest pr
        env:
          PR_NUM: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr close "$PR_NUM" --comment "🚫 rejected automatically: PRs from guest453 are auto-closed." || exit 0

  revert-guest-commits:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: checkout with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: revert push if it contains guest authored commits
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -e
          echo "scanning commits $BEFORE..$AFTER"
          shopt -s nocasematch
          authors="Guest453|victorromeojaime981|202215077"
          if git log --format="%an %ae" "$BEFORE..$AFTER" | grep -qiE "guest453|victorromeojaime981|202215077"; then
            echo "guest-authored commits found; reverting"
            git reset --hard "$BEFORE"
            git push --force origin "HEAD:refs/heads/main"
          else
            echo "no guest-authored commits; nothing to do"
          fi